name: Анонс релиза

# Сообщение о новой версии в Telegram-каналы. Отдельный workflow — он не
# входит в сборку и не может её сломать: запускается, когда релиз уже
# опубликован (release.yml → GitHub Release), либо вручную для любого тега
# (повторная отправка, если канал был недоступен).
# Идея — из FlClashX (job notify в build.yaml и workflow publish.yaml).
# Без секретов TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_IDS задача ничего не
# отправляет и завершается успешно.
run-name: Анонс ${{ inputs.tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v2.0.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notify-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # «Что нового» и флаг предварительной сборки берутся у самого релиза,
      # поэтому анонс совпадает с тем, что видят пользователи в приложении.
      - name: Данные релиза
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Неверный тег: $TAG" >&2; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,isPrerelease,url \
            > release.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          data = json.loads(pathlib.Path('release.json').read_text())
          pathlib.Path('release-notes.md').write_text(data.get('body') or '')
          print(f"prerelease={str(data.get('isPrerelease', False)).lower()}")
          print(f"url={data.get('url', '')}")
          PY
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Отправить анонс
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="$(cat release-notes.md)" python3 .github/scripts/notify_telegram.py
