name: Android release APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'android/**'
      - 'native/android/**'
      - 'native/mihomo/**'
      - 'tool/build_android_native.sh'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: '3.47.5'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: native/android/go.sum

      - name: Собрать ядро Mihomo (JNI, arm64-v8a + x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash tool/build_android_native.sh
          for abi in arm64-v8a x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/libkago_mihomo_bridge.so" \
              || { echo "Нет libkago_mihomo_bridge.so для $abi" >&2; exit 1; }
          done

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Ключ подписи
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KAGO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAGO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAGO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAGO_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kago-upload.jks"
            {
              echo "KAGO_ANDROID_KEYSTORE=$RUNNER_TEMP/kago-upload.jks"
              echo "KAGO_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KAGO_ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "KAGO_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo 'Подпись ключом владельца (секреты репозитория).'
          else
            echo "KAGO_ANDROID_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "kind=debugsigned" >> "$GITHUB_OUTPUT"
            echo '::warning::Секреты ключа не заданы — APK подписан debug-ключом. Только для тестов, не для публикации.'
          fi

      - name: flutter build apk --release
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Проверить подпись и ABI
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|x86_64)/libkago_mihomo_bridge.so'

      - name: Подготовить артефакт
        id: dist
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          NAME="KaGoVPN-Android-${VERSION%%+*}-${{ steps.signing.outputs.kind }}.apk"
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk "dist/android/$NAME"
          (cd dist/android && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.name }}
          path: dist/android/*
          retention-days: 30

      - name: GitHub Release (для тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/android/*
          prerelease: ${{ steps.signing.outputs.kind != 'release' }}
