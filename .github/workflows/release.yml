name: Release

# Единственный путь к GitHub Release. Собирает только системы из строки
# «Платформы: Android, Windows, macOS» первого раздела RELEASE_STATUS.md
# (без строки — все три) и публикует v<версия>, только если готовы файлы
# всех этих систем (.apk, .exe и .zip, .dmg). Релиз для одной системы не
# пересобирает и не выпускает другие; приложение берёт самый новый релиз,
# в котором есть файл для его системы (app_updater: pick). Список файлов
# SHA256SUMS.txt подписывается ключом релиза (тем же, что подписывает APK);
# приложение ставит обновление только с верной подписью. Опубликованный
# релиз не перезаписывается: каждая публикация — новая версия в pubspec.yaml.
# Запуск: тег v<версия> (совпадает с pubspec.yaml) или Actions → Release →
# Run workflow (тег создаётся на выбранном коммите).
# Предварительный релиз (тег с суффиксом, например v2.0.4-pre.1, или галочка
# «Предварительный релиз» при ручном запуске) публикуется с отметкой
# pre-release: файлы подписаны боевым ключом, но приложение такие релизы
# пропускает (app_updater: prerelease == true) — это способ прогнать весь
# релизный путь, не предлагая версию пользователям.
run-name: >-
  Release ${{ github.ref_type == 'tag' && github.ref_name
  || (inputs.prerelease && 'pre-release' || 'из pubspec.yaml') }}
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Предварительный релиз (пользователям не предлагается)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    # Только чтобы GitHub зарегистрировал workflow на ветке (иначе ручной
    # запуск через API отвечает 404): при таком пуше все задачи пропускаются.
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/release.yml'

# Сборкам — только чтение; запись нужна лишь задаче publish.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Какие системы собирать: строка «Платформы:» первого раздела
  # RELEASE_STATUS.md (его же публикует «Что нового»).
  plan:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.platforms.outputs.android }}
      windows: ${{ steps.platforms.outputs.windows }}
      macos: ${{ steps.platforms.outputs.macos }}
      json: ${{ steps.platforms.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Версия общая для всех систем: каждый релиз — от последнего
      # опубликованного, кому бы тот ни вышел (после Windows 2.6.0 релиз для
      # Android — 2.6.1 или 2.7.0, CLAUDE.md). Проверяется до сборок.
      - name: Версия новее последнего релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          NAME="${VERSION%%+*}"
          LATEST="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts \
            --limit 100 --json tagName --jq '.[].tagName' \
            | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [[ -n "$LATEST" && "$(printf '%s\n%s\n' "$LATEST" "$NAME" | sort -V | tail -1)" != "$NAME" ]] \
             || [[ "$LATEST" == "$NAME" ]]; then
            echo "::error::Версия $NAME в pubspec.yaml не новее последнего релиза $LATEST. Поднимите её от $LATEST (CLAUDE.md, Semantic Versioning)." >&2
            exit 1
          fi
          echo "::notice::Версия $NAME (последний релиз: ${LATEST:-нет})"

      - name: Платформы
        id: platforms
        run: |
          awk '/^## /{n++; next} n==1 && /^Для разработчиков/{exit} n==1' RELEASE_STATUS.md > release-notes.md
          LINE="$(grep -iE '^[[:space:]*_]*(Платформы|Platforms)[[:space:]*_]*:' release-notes.md | head -1 || true)"
          JSON=""
          for p in android windows macos; do
            if [[ -z "$LINE" ]] || echo "$LINE" | grep -qiE "\b${p}\b|\b${p%os}\b"; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
              JSON="$JSON\"$p\","
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done
          if [[ -z "$JSON" ]]; then
            echo "::error::В строке «$LINE» нет ни одной платформы (Android, Windows, macOS)." >&2
            exit 1
          fi
          echo "json=${JSON%,}" >> "$GITHUB_OUTPUT"
          echo "::notice::Релиз для: ${JSON%,}"

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    uses: ./.github/workflows/android-release.yml
    with:
      release: true
    # Каждой платформе — только её секреты.
    secrets:
      KAGO_ANDROID_KEYSTORE_BASE64: ${{ secrets.KAGO_ANDROID_KEYSTORE_BASE64 }}
      KAGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KAGO_ANDROID_KEYSTORE_PASSWORD }}
      KAGO_ANDROID_KEY_ALIAS: ${{ secrets.KAGO_ANDROID_KEY_ALIAS }}
      KAGO_ANDROID_KEY_PASSWORD: ${{ secrets.KAGO_ANDROID_KEY_PASSWORD }}

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    uses: ./.github/workflows/windows-release.yml
    with:
      release: true

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    uses: ./.github/workflows/macos-release.yml
    with:
      release: true
    secrets:
      KAGO_MACOS_CERT_P12_BASE64: ${{ secrets.KAGO_MACOS_CERT_P12_BASE64 }}
      KAGO_MACOS_CERT_PASSWORD: ${{ secrets.KAGO_MACOS_CERT_PASSWORD }}
      KAGO_APPLE_ID: ${{ secrets.KAGO_APPLE_ID }}
      KAGO_APPLE_TEAM_ID: ${{ secrets.KAGO_APPLE_TEAM_ID }}
      KAGO_APPLE_APP_PASSWORD: ${{ secrets.KAGO_APPLE_APP_PASSWORD }}
      KAGO_APPLE_API_KEY_BASE64: ${{ secrets.KAGO_APPLE_API_KEY_BASE64 }}
      KAGO_APPLE_API_KEY_ID: ${{ secrets.KAGO_APPLE_API_KEY_ID }}
      KAGO_APPLE_API_ISSUER: ${{ secrets.KAGO_APPLE_API_ISSUER }}

  publish:
    needs: [plan, android, windows, macos]
    # Пропущенная сборка системы, которой нет в «Платформы:», не мешает
    # публикации; упавшая или отменённая сборка нужной системы — мешает.
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && (needs.plan.outputs.android != 'true' || needs.android.result == 'success')
      && (needs.plan.outputs.windows != 'true' || needs.windows.result == 'success')
      && (needs.plan.outputs.macos != 'true' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Версия
        id: version
        env:
          PRERELEASE_INPUT: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          NAME="${VERSION%%+*}"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Неверная версия в pubspec.yaml: $NAME" >&2; exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Тег релиза: при пуше тега — он сам (с суффиксом предварительной
          # сборки, если есть), при ручном запуске — из pubspec.yaml.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # У v2.0.4-pre.1 версия приложения — 2.0.4: суффикс отбрасывается.
            BASE="${TAG#v}"; BASE="${BASE%%-*}"
            if [[ "$BASE" != "$NAME" ]]; then
              echo "::error::Тег $TAG не совпадает с версией pubspec.yaml ($NAME)."
              exit 1
            fi
          elif [[ "$PRERELEASE_INPUT" == "true" ]]; then
            TAG="v$NAME-pre.$GITHUB_RUN_NUMBER"
          else
            TAG="v$NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Предварительный релиз — тег с суффиксом после версии.
          if [[ "$TAG" == *-* ]]; then
            echo 'stable=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Предварительный релиз $TAG — приложение его не предложит."
          else
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi

      # Уже опубликованный релиз не заменяется: иначе любой запуск из ветки
      # подменил бы файлы, которые скачивают пользователи и обновление.
      - name: Релиз ещё не опубликован
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Релиз $TAG уже опубликован. Поднимите версию в pubspec.yaml." >&2
            exit 1
          fi

      # Артефакты платформ: KaGoVPN-Android-*, KaGoVPN-Windows-x64-*,
      # KaGoVPN-macOS-* (символы отладки называются symbols-* и не входят).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: KaGoVPN-*
          path: dist
          merge-multiple: true

      - name: Проверить состав релиза
        env:
          V: ${{ steps.version.outputs.name }}
          ANDROID: ${{ needs.plan.outputs.android }}
          WINDOWS: ${{ needs.plan.outputs.windows }}
          MACOS: ${{ needs.plan.outputs.macos }}
        run: |
          ls -lh dist
          FILES=()
          [[ "$ANDROID" == true ]] && FILES+=("KaGoVPN-Android-$V.apk" SHA256SUMS-Android.txt)
          [[ "$WINDOWS" == true ]] && FILES+=("KaGoVPN-Windows-x64-Setup-$V.exe" "KaGoVPN-Windows-x64-$V.zip" SHA256SUMS-Windows.txt)
          [[ "$MACOS" == true ]] && FILES+=("KaGoVPN-macOS-$V.dmg" SHA256SUMS-macOS.txt)
          for f in "${FILES[@]}"; do
            test -s "dist/$f" || { echo "::error::В релизе нет $f" >&2; exit 1; }
          done
          if ls dist | grep -q debugsigned; then
            echo "::error::APK подписан debug-ключом — такой нельзя публиковать." >&2
            exit 1
          fi

      # SHA256SUMS.txt — все файлы релиза; SHA256SUMS.txt.sig — подпись
      # RSA-PKCS#1 v1.5/SHA-256 ключом релиза (keystore Android). Открытый
      # ключ встроен в приложение (lib/core/update/release_signature.dart);
      # шаг проверяет, что подписывает именно он.
      - name: Подписать список файлов
        env:
          KEYSTORE_BASE64: ${{ secrets.KAGO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAGO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAGO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAGO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          (cd dist && sha256sum KaGoVPN-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "$KEYSTORE_BASE64" | base64 -d > "$WORK/upload.jks"
          P12_PASSWORD="$(openssl rand -hex 24)"
          export P12_PASSWORD
          keytool -importkeystore -noprompt \
            -srckeystore "$WORK/upload.jks" -srcstorepass:env KEYSTORE_PASSWORD \
            -srcalias "$KEY_ALIAS" -srckeypass:env KEY_PASSWORD \
            -destkeystore "$WORK/key.p12" -deststoretype PKCS12 \
            -deststorepass:env P12_PASSWORD -destkeypass:env P12_PASSWORD > /dev/null
          openssl pkcs12 -in "$WORK/key.p12" -nocerts -nodes -passin env:P12_PASSWORD -out "$WORK/key.pem"
          EXPECTED="$(grep -oE "'[0-9a-f]{64}'" lib/core/update/release_signature.dart | tr -d "'\n")"
          ACTUAL="$(openssl rsa -in "$WORK/key.pem" -noout -modulus | cut -d= -f2 | tr 'A-F' 'a-f')"
          if [[ -z "$EXPECTED" || "$EXPECTED" != "$ACTUAL" ]]; then
            echo "::error::Ключ релиза не совпадает с ключом, встроенным в приложение." >&2
            exit 1
          fi
          openssl dgst -sha256 -sign "$WORK/key.pem" -out dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
          openssl rsa -in "$WORK/key.pem" -pubout -out "$WORK/pub.pem" 2> /dev/null
          openssl dgst -sha256 -verify "$WORK/pub.pem" -signature dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt

      # «Что нового» — первый раздел RELEASE_STATUS.md до «Для разработчиков»;
      # его показывает диалог обновления в приложении.
      - name: Описание релиза
        env:
          V: ${{ steps.version.outputs.name }}
          PLATFORMS: ${{ needs.plan.outputs.json }}
        run: |
          awk '/^## /{n++; next} n==1 && /^Для разработчиков/{exit} n==1' RELEASE_STATUS.md > release-notes.md
          test -s release-notes.md || echo "KaGo VPN $V" > release-notes.md
          # Системы релиза (задача plan); release.json читает приложение,
          # когда API GitHub недоступен.
          printf '{"version":"%s","platforms":[%s]}\n' "$V" "$PLATFORMS" > dist/release.json
          cat dist/release.json

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Пустая строка в выражениях GitHub ложна, поэтому условие
          # записано «от предварительного релиза»: у стабильного — только
          # «KaGo VPN <версия>».
          name: >-
            KaGo VPN ${{ steps.version.outputs.name }}${{
            steps.version.outputs.stable != 'true'
            && format(' ({0})', steps.version.outputs.tag) || '' }}
          files: dist/*
          # Предварительный релиз не становится «latest»: ни страница
          # releases/latest, ни приложение его не подхватят.
          prerelease: ${{ steps.version.outputs.stable != 'true' }}
          make_latest: ${{ steps.version.outputs.stable == 'true' }}
