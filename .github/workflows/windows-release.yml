name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/build_windows_release.ps1'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: '3.47.5'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Формат, analyze, тесты, flutter build windows --release и ZIP.
      - name: Сборка (tool/build_windows_release.ps1)
        shell: pwsh
        run: ./tool/build_windows_release.ps1

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -split '\+')[0]
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
            if (-not (Test-Path $candidate)) { choco install innosetup -y --no-progress | Out-Host }
            $iscc = $candidate
          } else { $iscc = $iscc.Source }
          $release = Resolve-Path 'build/windows/x64/runner/Release'
          $out = Resolve-Path 'dist'
          & $iscc "/DAppVersion=$version" "/DSourceDir=$release" "/DOutputDir=$out" 'windows/installer/kago_vpn.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          "version=$version" >> $env:GITHUB_ENV

      - name: Подготовить артефакт
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/out | Out-Null
          Copy-Item dist/KaGoVPN-Windows-x64.zip "dist/out/KaGoVPN-Windows-x64-$env:version.zip"
          Copy-Item dist/KaGoVPN-Windows-x64-Setup-*.exe dist/out/
          Get-ChildItem dist/out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/out/SHA256SUMS.txt
          Get-ChildItem dist/out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: KaGoVPN-Windows-x64-${{ env.version }}
          path: dist/out/*
          retention-days: 30

      - name: GitHub Release (для тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/out/*
          prerelease: true
