name: macOS release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать GitHub Release v<версия из pubspec.yaml>'
        type: boolean
        default: false
  push:
    branches:
      - 'claude/**'
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/macos-release.yml'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: '3.47.5'
      # Встроенное ядро — та же закреплённая версия, что на Windows и Android.
      MIHOMO_VERSION: 'v1.19.32'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Плагины собираются через CocoaPods: macos/Podfile поднимает им минимальную
      # версию до macOS 12 (через Swift Package Manager это не настроить, а
      # flutter_inappwebview_macos с его 10.11 не компилируется новым Xcode).
      - name: flutter pub get
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Версия
        id: version
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          NAME="${VERSION%%+*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$NAME" ]]; then
            echo "::error::Тег ${GITHUB_REF#refs/tags/} не совпадает с версией pubspec.yaml ($NAME)."
            exit 1
          fi

      # Ядро Mihomo для Apple Silicon и Intel из официального релиза: проверка
      # SHA-256 из GitHub API, затем один universal-бинарник (lipo) с ad-hoc
      # подписью (lipo снимает подпись Go-линкера, а arm64 без подписи не запустится).
      - name: Ядро Mihomo (universal)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p core && cd core
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/$MIHOMO_VERSION" > release.json
          pick() {
            for name in "$@"; do
              if jq -e --arg n "$name" '.assets[] | select(.name == $n)' release.json > /dev/null; then
                echo "$name"; return 0
              fi
            done
            return 1
          }
          fetch() {
            local name="$1" out="$2"
            local url digest
            url="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .browser_download_url' release.json)"
            digest="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // ""' release.json)"
            curl -fsSL "$url" -o "$name"
            if [[ -n "$digest" ]]; then
              echo "${digest#sha256:}  $name" | shasum -a 256 -c -
            else
              echo "::warning::Для $name в релизе нет SHA-256; проверены только HTTPS-источник и запуск."
            fi
            gunzip -c "$name" > "$out"
            chmod +x "$out"
          }
          ARM="$(pick "mihomo-darwin-arm64-$MIHOMO_VERSION.gz")"
          AMD="$(pick "mihomo-darwin-amd64-compatible-$MIHOMO_VERSION.gz" \
                      "mihomo-darwin-amd64-v1-$MIHOMO_VERSION.gz" \
                      "mihomo-darwin-amd64-$MIHOMO_VERSION.gz")"
          echo "arm64: $ARM"; echo "x86_64: $AMD"
          fetch "$ARM" mihomo-arm64
          fetch "$AMD" mihomo-amd64
          lipo -create -output mihomo mihomo-arm64 mihomo-amd64
          lipo -info mihomo
          codesign --force --sign - mihomo
          ./mihomo -v | tee version.txt
          grep -q "${MIHOMO_VERSION#v}" version.txt

      - name: flutter build macos --release
        run: flutter build macos --release --split-debug-info=build/symbols/macos

      # С сертификатом Apple Developer ID (секреты KAGO_MACOS_*/KAGO_APPLE_*) —
      # подпись Developer ID с Hardened Runtime и нотаризация: macOS открывает
      # приложение без предупреждения «Apple не удалось подтвердить…». Без
      # секретов — ad-hoc подпись (открыть вручную: «Конфиденциальность и
      # безопасность → Всё равно открыть»).
      - name: Встроить ядро, подписать и нотаризовать приложение
        id: sign
        env:
          CERT_P12: ${{ secrets.KAGO_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.KAGO_MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.KAGO_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.KAGO_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.KAGO_APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/KaGo VPN.app"
          cp core/mihomo "$APP/Contents/Resources/mihomo"
          if [[ -n "$CERT_P12" && -n "$CERT_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            KEYCHAIN="$RUNNER_TEMP/kago-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/kago-cert.p12"
            security import "$RUNNER_TEMP/kago-cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/kago-cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -n 1 | sed -E 's/.*"(.*)"/\1/')"
            if [[ -z "$IDENTITY" ]]; then
              echo "::error::В сертификате нет identity «Developer ID Application»."
              exit 1
            fi
            echo "KAGO_MAC_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            # Изнутри наружу: ядро, фреймворки, затем само приложение.
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP/Contents/Resources/mihomo"
            find "$APP/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$IDENTITY" "{}"
            codesign --force --options runtime --timestamp \
              --entitlements macos/Runner/Release.entitlements --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/kago-app.zip"
            xcrun notarytool submit "$RUNNER_TEMP/kago-app.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
            echo "kind=notarized" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* || "${{ inputs.release }}" == "true" ]]; then
              echo "::warning::Нет секретов Apple Developer ID: .dmg подписан ad-hoc, macOS покажет «Apple не удалось подтвердить…»."
            fi
            # Ad-hoc подпись всего бандла (ядро внутри входит в печать подписи).
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            echo "kind=adhoc" >> "$GITHUB_OUTPUT"
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"

      - name: Собрать .dmg
        id: dist
        env:
          APPLE_ID: ${{ secrets.KAGO_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.KAGO_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.KAGO_APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          NAME="KaGoVPN-macOS-${{ steps.version.outputs.name }}"
          DMG="dist/macos/$NAME.dmg"
          mkdir -p dmgroot dist/macos
          cp -R "build/macos/Build/Products/Release/KaGo VPN.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "KaGo VPN" -srcfolder dmgroot -ov -format UDZO "$DMG"
          if [[ "${{ steps.sign.outputs.kind }}" == notarized ]]; then
            codesign --force --timestamp --sign "$KAGO_MAC_IDENTITY" "$DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          fi
          cd dist/macos && shasum -a 256 *.dmg > SHA256SUMS-macOS.txt && ls -lh
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.name }}
          path: dist/macos/*
          retention-days: 30

      # Тег v<версия> или ручной запуск с release=true; тот же релиз, что у Android.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: KaGo VPN ${{ steps.version.outputs.name }}
          files: dist/macos/*
          prerelease: false
