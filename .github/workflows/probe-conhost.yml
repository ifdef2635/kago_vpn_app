name: Проба conhost (временный)

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/probe-conhost.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Варианты запуска
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'probe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $conhost = Join-Path $env:SystemRoot 'System32\conhost.exe'
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          (Get-Item $conhost).VersionInfo | Format-List FileVersion, ProductVersion
          [Environment]::OSVersion
          function Check([string]$name) {
            Start-Sleep -Seconds 3
            $f = Join-Path $dir "$name.txt"
            if (Test-Path $f) { "OK   $name" } else { "FAIL $name" }
          }
          # 1. Start-Process -Wait
          $p = Start-Process -FilePath $conhost -ArgumentList @('--headless', 'powershell.exe', '-NoProfile', '-Command', "Set-Content -LiteralPath '$dir\a.txt' -Value ok") -Wait -PassThru
          "a exit=$($p.ExitCode)"; Check 'a'
          # 2. full path to powershell, quoted
          $p = Start-Process -FilePath $conhost -ArgumentList ('--headless "' + $ps + '" -NoProfile -Command "Set-Content -LiteralPath ''' + $dir + '\b.txt'' -Value ok"') -Wait -PassThru
          "b exit=$($p.ExitCode)"; Check 'b'
          # 3. without --headless
          $p = Start-Process -FilePath $conhost -ArgumentList @('powershell.exe', '-NoProfile', '-Command', "Set-Content -LiteralPath '$dir\c.txt' -Value ok") -Wait -PassThru
          "c exit=$($p.ExitCode)"; Check 'c'
          # 4. direct call operator (inherits console)
          & $conhost --headless powershell.exe -NoProfile -Command "Set-Content -LiteralPath '$dir\d.txt' -Value ok"
          "d exit=$LASTEXITCODE"; Check 'd'
          # 5. --headless with -WindowStyle Hidden on Start-Process (as in the app)
          $p = Start-Process -FilePath $conhost -WindowStyle Hidden -ArgumentList @('--headless', 'powershell.exe', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden', '-Command', "Set-Content -LiteralPath '$dir\e.txt' -Value ok") -Wait -PassThru
          "e exit=$($p.ExitCode)"; Check 'e'
          # 6. from cmd with redirected output (like Dart Process.run)
          cmd /c "`"$conhost`" --headless powershell.exe -NoProfile -Command `"Set-Content -LiteralPath '$dir\f.txt' -Value ok`" > `"$dir\f.out`" 2>&1"
          "f exit=$LASTEXITCODE"; Check 'f'
          Get-Content "$dir\f.out" -ErrorAction SilentlyContinue
          # 7. scheduled task (Interactive, highest) with conhost --headless
          $user = "$env:USERDOMAIN\$env:USERNAME"
          $action = New-ScheduledTaskAction -Execute $conhost -Argument ('--headless "' + $ps + '" -NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -Command "Set-Content -LiteralPath ''' + $dir + '\g.txt'' -Value ok"')
          $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero) -MultipleInstances Queue -Priority 4
          Register-ScheduledTask -TaskName 'KaGoProbe' -TaskPath '\KaGoProbe\' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          schtasks /run /tn '\KaGoProbe\KaGoProbe'
          Start-Sleep -Seconds 8
          Get-ScheduledTaskInfo -TaskName 'KaGoProbe' -TaskPath '\KaGoProbe\' | Format-List LastRunTime, LastTaskResult
          Check 'g'
          # 8. same task without conhost (old way)
          $action = New-ScheduledTaskAction -Execute $ps -Argument ('-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -Command "Set-Content -LiteralPath ''' + $dir + '\h.txt'' -Value ok"')
          Register-ScheduledTask -TaskName 'KaGoProbe2' -TaskPath '\KaGoProbe\' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          schtasks /run /tn '\KaGoProbe\KaGoProbe2'
          Start-Sleep -Seconds 8
          Get-ScheduledTaskInfo -TaskName 'KaGoProbe2' -TaskPath '\KaGoProbe\' | Format-List LastRunTime, LastTaskResult
          Check 'h'
          exit 0
