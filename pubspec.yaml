name: kago_vpn
description: KaGo VPN client for Mihomo (Clash.Meta), usekago.net.
publish_to: none
version: 2.0.1+20001
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  yaml: ^3.1.3
  ffi: ^2.1.4
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  win32_registry: ^2.1.0
  win32: ^5.15.0
  # 6.2.0-beta: the 6.1.x Android plugin uses proguard-android.txt, which
  # AGP 9 rejects.
  flutter_inappwebview: 6.2.0-beta.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  ffigen: ^18.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/kago_mark.svg
    - assets/branding/kago_icon.png
  # Windows has no colour flag emoji: country flags in server names come from
  # this font (Twemoji, CC BY 4.0 — assets/fonts/TwemojiCountryFlags-LICENSE.md).
  fonts:
    - family: KagoFlags
      fonts:
        - asset: assets/fonts/TwemojiCountryFlags.ttf
